server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/css text/markdown text/yaml application/javascript application/json;

    gzip on;
    gzip_types text/plain text/css text/markdown text/yaml text/javascript application/javascript application/json image/svg+xml;

    # The playground imports live ES modules from /src; its /api/submit endpoint is
    # mocked in the browser (playground/mock.js), so no server route is needed.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cloudflare Pages header rules (docs/public/_headers); not content.
    location = /_headers {
        return 404;
    }

    # Markdown twins of every page (/configuration.md), llms.txt files and the agent skill.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~ \.ya?ml$ {
        types { }
        default_type text/yaml;
        try_files $uri =404;
    }
}
